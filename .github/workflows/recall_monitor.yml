name: Recall Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes; GitHub may add up to ~30 min delay at peak
  workflow_dispatch:        # allow manual "Run workflow" from Actions tab

concurrency:
  group: recall-monitor
  cancel-in-progress: false  # don't drop a run mid-commit; queue instead

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feeds
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: python recall_monitor.py

      - name: Commit updated state
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
