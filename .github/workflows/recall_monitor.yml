name: Recall Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: recall-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            seen_items.json
            nhtsa_timing_log.jsonl
          key: recall-state-${{ github.run_id }}
          restore-keys: recall-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check NHTSA
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: python recall_monitor.py

      - name: Commit CSV if updated
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add recalls_2020_present.csv 2>/dev/null || true
          git diff --staged --quiet && echo "CSV unchanged, nothing to commit." && exit 0
          git commit -m "update: recalls CSV [skip ci]"
          for i in 1 2 3; do
            git fetch origin master
            git rebase origin/master && git push origin HEAD:master && break
            echo "Retry $i..." && sleep $((i * 3))
          done
